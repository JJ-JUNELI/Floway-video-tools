<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOV 透明导出 · 验证样片(Phase 0)</title>
<style>
  body { margin: 0; background: #0d1017; color: #e6e9ef; font: 14px/1.6 system-ui, "Segoe UI", sans-serif; padding: 32px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b93a7; margin: 0 0 24px; }
  .panel { background: #161b26; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; max-width: 720px; }
  label { display: inline-block; margin-right: 16px; }
  select, button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
    background: #1f2633; color: #e6e9ef; cursor: pointer; }
  button.primary { background: #6CA8D9; color: #0d1017; border: none; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
  /* 棋盘格底:确认透明区域真透明 */
  .checker { background-image:
      linear-gradient(45deg, #2a2f3a 25%, transparent 25%), linear-gradient(-45deg, #2a2f3a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2f3a 75%), linear-gradient(-45deg, transparent 75%, #2a2f3a 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; border-radius: 8px; }
  canvas { display: block; border-radius: 8px; }
  code { background: #0d1017; padding: 2px 6px; border-radius: 4px; color: #9ecbff; }
  .log { margin-top: 16px; color: #8b93a7; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  .hint { color: #8b93a7; font-size: 13px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px; }
</style>
</head>
<body>
  <h1>MOV 透明导出 · 验证样片</h1>
  <p class="sub">Phase 0:未压缩 RGBA(<code>'raw '</code> depth 32)的最小 MOV 封装器,验证三家编辑器能否带 alpha 导入。</p>

  <div class="panel">
    <div class="row">
      <label>像素字节序
        <select id="order">
          <option value="argb" selected>argb(默认,对应 ffmpeg -pix_fmt argb)</option>
          <option value="rgba">rgba</option>
          <option value="bgra">bgra</option>
        </select>
      </label>
      <label>帧数
        <select id="frames">
          <option value="20" selected>20</option>
          <option value="40">40</option>
          <option value="60">60</option>
        </select>
      </label>
    </div>

    <div class="row">
      <div class="checker"><canvas id="preview" width="512" height="288"></canvas></div>
    </div>

    <div class="row">
      <button class="primary" id="gen">⬇ 生成并下载 sample.mov</button>
      <button id="play">▶ 预览动画</button>
    </div>

    <div class="log" id="log">就绪。点「生成」会渲染透明动画(柔光 + 半透明形状)并封成 .mov 下载。</div>

    <div class="hint">
      <b>验证步骤</b>:把下载的 <code>sample.mov</code> 拖进 剪映/CapCut、Premiere/AE、DaVinci Resolve,
      在它下面垫一张不透明底图 —— 应能透出底图(真透明),柔光边缘应平滑(不发硬)。<br>
      若颜色通道错乱(红蓝互换等),换上面的「像素字节序」重新生成再试。
    </div>
  </div>

<script type="module">
import { MovMuxer } from '../shared/mov-muxer.js';

const W = 512, H = 288;
const cv = document.getElementById('preview');
const ctx = cv.getContext('2d');
const log = document.getElementById('log');

// 渲染第 i/total 帧到给定 ctx:透明底 + 移动柔光 + 半透明圆
function drawFrame(c, i, total) {
  c.clearRect(0, 0, W, H);                       // 真透明底
  const t = i / total;
  // 半透明渐变方块(测试均匀半透 alpha)
  c.fillStyle = 'rgba(108,168,217,0.45)';
  c.fillRect(40, 60, 160, 160);
  // 移动的柔光(径向渐变,测试 alpha 边缘是否保持朦胧)
  const gx = 120 + t * 280, gy = 144;
  const grad = c.createRadialGradient(gx, gy, 0, gx, gy, 110);
  grad.addColorStop(0, 'rgba(255,210,120,0.9)');
  grad.addColorStop(0.5, 'rgba(255,160,80,0.35)');
  grad.addColorStop(1, 'rgba(255,160,80,0)');
  c.fillStyle = grad;
  c.beginPath(); c.arc(gx, gy, 110, 0, Math.PI * 2); c.fill();
  // 实心描边文字(测试不透明区)
  c.fillStyle = '#ffffff';
  c.font = 'bold 28px system-ui';
  c.fillText('FLOWAY α', 300, 250);
}

document.getElementById('play').onclick = () => {
  let i = 0; const total = +document.getElementById('frames').value;
  (function loop() { drawFrame(ctx, i % total, total); i++; if (i < total * 2) requestAnimationFrame(loop); })();
};

document.getElementById('gen').onclick = () => {
  const total = +document.getElementById('frames').value;
  const order = document.getElementById('order').value;
  log.textContent = `渲染 ${total} 帧 @ ${W}×${H},字节序 ${order} …`;

  const mux = new MovMuxer({ width: W, height: H, fps: 30, pixelOrder: order });
  for (let i = 0; i < total; i++) {
    drawFrame(ctx, i, total);
    const rgba = ctx.getImageData(0, 0, W, H).data;
    mux.addFrameRGBA(rgba);
  }
  const bytes = mux.finalize();
  const blob = new Blob([bytes], { type: 'video/quicktime' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sample.mov'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);

  const mb = (bytes.length / 1048576).toFixed(2);
  log.textContent = `完成:${total} 帧,${mb} MB,字节序 ${order}。\n已触发下载 sample.mov —— 拖进编辑器验证 alpha。`;
};
</script>
</body>
</html>
