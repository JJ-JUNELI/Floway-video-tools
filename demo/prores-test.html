<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProRes 4444 透明导出 · ffmpeg.wasm spike</title>
<style>
  body { margin: 0; background: #0d1017; color: #e6e9ef; font: 14px/1.6 system-ui, "Segoe UI", sans-serif; padding: 32px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b93a7; margin: 0 0 24px; }
  .panel { background: #161b26; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; max-width: 760px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #1f2633; color: #e6e9ef; cursor: pointer; }
  button.primary { background: #6CA8D9; color: #0d1017; border: none; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; align-items: center; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
  .checker { background-image:
      linear-gradient(45deg, #2a2f3a 25%, transparent 25%), linear-gradient(-45deg, #2a2f3a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2f3a 75%), linear-gradient(-45deg, transparent 75%, #2a2f3a 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; border-radius: 8px; }
  canvas { display: block; border-radius: 8px; }
  code { background: #0d1017; padding: 2px 6px; border-radius: 4px; color: #9ecbff; }
  .log { margin-top: 16px; color: #8b93a7; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; max-height: 260px; overflow:auto; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
</style>
</head>
<body>
  <h1>ProRes 4444 透明导出 · ffmpeg.wasm spike</h1>
  <p class="sub">浏览器内用 ffmpeg.wasm(单线程)把 Canvas 帧编码成 <code>ProRes 4444</code> 透明 MOV。验证整条链路是否在浏览器里跑通。</p>

  <div class="panel">
    <div class="row"><div class="checker"><canvas id="preview" width="640" height="360"></canvas></div></div>
    <div class="row">
      <button class="primary" id="load">① 加载 ffmpeg.wasm(~31MB,首次较慢)</button>
      <button class="primary" id="gen" disabled>② 编码 + 下载 ProRes MOV</button>
    </div>
    <div class="log" id="log">点①先加载 ffmpeg.wasm。加载完再点②。控制台若报错请把错误贴给我。</div>
  </div>

<!-- 本地同源加载 ffmpeg.wasm UMD:worker(814.ffmpeg.js)同源加载,绕开跨域 Worker 限制 -->
<script src="../shared/vendor/ffmpeg/ffmpeg.js"></script>
<script type="module">
const { FFmpeg } = window.FFmpegWASM;

const W = 640, H = 360, N = 24, FPS = 30;
const cv = document.getElementById('preview');
const ctx = cv.getContext('2d');
const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += '\n' + m; logEl.scrollTop = logEl.scrollHeight; };

let ffmpeg = null;

function drawFrame(c, i, total) {
  c.clearRect(0, 0, W, H);
  const t = i / total;
  c.fillStyle = 'rgba(108,168,217,0.45)';
  c.fillRect(50, 80, 200, 200);
  const gx = 150 + t * 360, gy = 180;
  const grad = c.createRadialGradient(gx, gy, 0, gx, gy, 140);
  grad.addColorStop(0, 'rgba(255,210,120,0.9)');
  grad.addColorStop(0.5, 'rgba(255,160,80,0.35)');
  grad.addColorStop(1, 'rgba(255,160,80,0)');
  c.fillStyle = grad;
  c.beginPath(); c.arc(gx, gy, 140, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#ffffff';
  c.font = 'bold 34px system-ui';
  c.fillText('FLOWAY α', 380, 320);
}

document.getElementById('load').onclick = async (e) => {
  e.target.disabled = true;
  try {
    log('加载 ffmpeg.wasm core 中…');
    ffmpeg = new FFmpeg();
    ffmpeg.on('log', ({ message }) => log('[ff] ' + message));
    const vendor = new URL('../shared/vendor/ffmpeg/', location.href).href;
    await ffmpeg.load({
      coreURL: vendor + 'ffmpeg-core.js',
      wasmURL: vendor + 'ffmpeg-core.wasm',
    });
    log('✅ ffmpeg.wasm 已加载。点②编码。');
    document.getElementById('gen').disabled = false;
  } catch (err) {
    log('❌ 加载失败: ' + (err && err.message ? err.message : err));
    log('(若是 worker / 跨域报错,可能需要改用本地 vendored 方式,告诉我)');
    e.target.disabled = false;
  }
};

document.getElementById('gen').onclick = async (e) => {
  e.target.disabled = true;
  try {
    log(`渲染 ${N} 帧 @ ${W}×${H} → 拼原始 RGBA…`);
    const frameBytes = W * H * 4;
    const all = new Uint8Array(frameBytes * N);
    for (let i = 0; i < N; i++) {
      drawFrame(ctx, i, N);
      all.set(ctx.getImageData(0, 0, W, H).data, i * frameBytes);
    }
    await ffmpeg.writeFile('in.raw', all);
    log('编码 ProRes 4444 (yuva444p10le)…');
    const t0 = performance.now();
    await ffmpeg.exec([
      '-f', 'rawvideo', '-pix_fmt', 'rgba', '-s', `${W}x${H}`, '-r', String(FPS),
      '-i', 'in.raw',
      '-c:v', 'prores_ks', '-profile:v', '4444', '-pix_fmt', 'yuva444p10le',
      '-y', 'out.mov',
    ]);
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    const data = await ffmpeg.readFile('out.mov');
    const blob = new Blob([data.buffer], { type: 'video/quicktime' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'prores_browser.mov'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    log(`✅ 完成:${(data.length / 1048576).toFixed(2)} MB,编码耗时 ${secs}s。已下载 prores_browser.mov。`);
    log('→ 拖进剪映/Premiere/Resolve,垫底图确认透明。');
  } catch (err) {
    log('❌ 编码失败: ' + (err && err.message ? err.message : err));
  }
  e.target.disabled = false;
};
</script>
</body>
</html>
